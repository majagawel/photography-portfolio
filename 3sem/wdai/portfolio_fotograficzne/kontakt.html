<!DOCTYPE html>
<html>
    <head>
        
        <title>Portfolio fotograficzne Maja Gaweł</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    </head>

    <body>
        <header id="header"></header>
        <nav id="nav"></nav>

        <main class="contact">
            <div>
                <form id="contactForm" action="https://formsubmit.co/ajax/maja.gawel06@gmail.com" method="POST">
                    <h1>Napisz do mnie</h1>
                    <div class="form-one">
                        <input type="text" id="name" name="name" placeholder="Imie" required>
                        <input type="text" id="surname" name="surname" placeholder="Nazwisko" required> 

                    </div>
                    
                    <div class="form-one">
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="form-one">
                        <select id="type" name="type" placeholder="Typ sesji" required>
                            <option value="" disabled selected>Typ sesji</option>
                            <option value="portretowa">Sesja portretowa</option>
                            <option value="rodzinna">Sesja rodzinna / dziecięca</option>
                            <option value="wizerunkowa">Sesja biznesowa / wizerunkowa</option>
                            <option value="slubna">Reportaż ślubny</option>
                            <option value="plenerowa">Sesja plenerowa</option>
                        </select>
                    </div>

                    <textarea name="message" id="message" placeholder="Wiadomość" required></textarea>
                    <input type="submit" class="button-form" value="Wyślij">

                </form>

            </div>
            
            


        </main>
    <script src="script.js"></script>
    </body>




</html>
