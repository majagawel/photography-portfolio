<!DOCTYPE html>

<html>
    <head>
        
        <title>Portfolio fotograficzne Maja Gaweł</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&family=WindSong:wght@400;500&display=swap" rel="stylesheet">
    </head>


    <body>

        <header id="header"></header>
        <nav id="nav"></nav>

        <main class="site-container">
            <div class="main-content">
                <aside id="categories">
                    <span class="filter-title">Kategorie</span>
                    <button onclick="showPhotos('all')" id="all" class="button">Wszystkie</button>
                    <button onclick="showPhotos('krajobrazy')" id="krajobrazy" class="button">Krajobrazy</button>
                    <button onclick="showPhotos('ludzie')" id="ludzie" class="button">Ludzie</button>
                    <button onclick="showPhotos('natura')" id="natura" class="button">Natura</button>
                    <button onclick="showPhotos('wydarzenia')" id="wydarzenia" class="button">Wydarzenia</button>
                </aside>

                <section section id="gallery" class="gallery-grid"></section>

            </div>
            

        </main>

        <div id="lightbox" class="lightbox">
            <span class="lightbox-close">&times;</span>
            <button id="prev-btn" class="lightbox-nav">&#10094;</button>
            
            <div class="lightbox-content">
                <img id="lightbox-img" src="" alt="Powiększone zdjęcie">
            </div>
            
            <button id="next-btn" class="lightbox-nav">&#10095;</button>
        </div>



        <footer id="footer"></footer>

    
        <script src="photos.js"></script>
        <script src="script.js"></script>
    </body>

</html>
